name: atualizar

on:
  schedule:
    # 06:10 UTC = 03:10 em Sao Paulo (UTC-3).
    - cron: '10 6 * * *'
  workflow_dispatch:
    inputs:
      max_checks:
        description: 'Limite de streams validados nesta execucao (vazio usa config/config.json)'
        required: false
        type: string
      skip_epg:
        description: 'Pular a etapa de EPG'
        required: false
        type: boolean
        default: false

# Nenhuma permissao no nivel do workflow. Cada job pede o minimo que precisa, e
# so a ultima recebe escrita. Nenhum segredo alem do GITHUB_TOKEN do proprio run.
permissions: {}

concurrency:
  group: atualizar
  cancel-in-progress: false

env:
  # O runner do GitHub fica nos Estados Unidos. O resultado aqui NAO e o mesmo de
  # uma maquina no Brasil, e o relatorio guarda os dois separados. Vale para todas
  # as jobs, para nenhuma gravar resultado sob o ponto de observacao errado.
  IPTV_VANTAGE: github-us

jobs:
  # ---------------------------------------------------------------------------
  # 1. Validacao: so codigo do projeto e ffprobe. Sem permissao de escrita.
  # ---------------------------------------------------------------------------
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version | head -1

      - name: Instalar dependencias do projeto
        # O projeto nao tem script de ciclo de vida; desligar reduz a superficie.
        run: npm ci --ignore-scripts

      # GET condicional das fontes: evita rebaixar channels.json/guides.json
      # quando a origem nao mudou (ETag / Last-Modified).
      #
      # Esta e a UNICA job que grava este cache. As outras so restauram, com
      # actions/cache/restore e este mesmo prefixo. Se a job 'epg' pudesse gravar,
      # o codigo de terceiro que roda la envenenaria o channels.json que a job de
      # publicacao usa para montar as playlists, anulando o isolamento.
      - name: Cache das fontes HTTP (grava)
        uses: actions/cache@v4
        with:
          path: cache
          key: fontes-validar-${{ github.run_id }}
          restore-keys: |
            fontes-validar-

      - name: Checar configuracao
        run: node src/cli.ts check

      - name: Validar streams
        env:
          IPTV_VALIDATION_MAXCHECKSPERRUN: ${{ inputs.max_checks }}
        run: node src/cli.ts validate

      - uses: actions/upload-artifact@v4
        with:
          name: health
          path: data/health.json
          retention-days: 2
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. EPG: esta e a UNICA job que executa codigo de terceiro — o grabber do
  #    iptv-org/epg e o postinstall dele. Por isso ela nao tem permissao de
  #    escrita, nao recebe credencial e entrega apenas arquivos por artifact.
  #    O workspace dela e descartado no fim e nunca vira commit.
  # ---------------------------------------------------------------------------
  epg:
    runs-on: ubuntu-latest
    needs: validar
    if: ${{ inputs.skip_epg != true }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias do projeto
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: health
          path: data

      # Somente leitura, e so a chave exata gravada pela job 'validar' DESTE run.
      # Sem fallback por prefixo: nada de outra execucao entra aqui.
      - name: Cache das fontes HTTP (so leitura)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: fontes-validar-${{ github.run_id }}

      # config.json carrega epg.grabberRef (commit SHA fixado): mudar o pin invalida
      # o cache. O codigo tambem confere HEAD e arvore limpa a cada execucao e
      # refaz o clone se o diretorio em cache divergir do pin.
      - name: Cache do grabber de EPG
        uses: actions/cache@v4
        with:
          path: .epg-grabber
          key: epg-grabber-${{ hashFiles('config/epg.json', 'config/config.json') }}-${{ github.run_id }}
          restore-keys: |
            epg-grabber-${{ hashFiles('config/epg.json', 'config/config.json') }}-

      - name: Montar o guia
        run: node src/cli.ts epg

      - uses: actions/upload-artifact@v4
        with:
          name: epg
          path: |
            epg.xml.gz
            data/epg-coverage.json
            data/epg-index.json
          retention-days: 2
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Publicacao: checkout limpo, recebe os artifacts das jobs anteriores e e a
  #    unica com escrita. Nenhum codigo de terceiro roda aqui, e o commit aceita
  #    apenas os caminhos da lista — arquivo fora dela derruba a job.
  # ---------------------------------------------------------------------------
  publicar:
    runs-on: ubuntu-latest
    needs: [validar, epg]
    if: ${{ always() && needs.validar.result == 'success' && needs.epg.result != 'failure' }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias do projeto
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: health
          path: data

      - uses: actions/download-artifact@v4
        if: ${{ needs.epg.result == 'success' }}
        with:
          name: epg
          path: .

      # Somente leitura, e so a chave exata gravada pela job 'validar' DESTE run.
      # Sem fallback por prefixo: a job que publica nao le cache de outra execucao.
      - name: Cache das fontes HTTP (so leitura)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: fontes-validar-${{ github.run_id }}

      # Os arquivos de EPG vieram de um workspace onde codigo de terceiro rodou.
      # Antes de publicar, sao conferidos de novo aqui: gzip valido, XMLTV
      # balanceado, timestamps validos, nenhum programa orfao, indice com
      # tipos e tamanhos dentro do esperado.
      - name: Verificar arquivos de EPG
        if: ${{ needs.epg.result == 'success' }}
        run: node src/cli.ts verify-epg

      # build nao roda grabber: le data/epg-index.json entregue pela job anterior.
      - name: Gerar playlists e relatorios
        run: node src/cli.ts build

      - name: Comitar resultado
        env:
          # Credencial so existe nesta etapa, num workspace onde nada de terceiro rodou.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Lista fechada. Nada entra no commit por estar na pasta certa.
          PERMITIDOS="
          playlist.m3u
          playlist-br.m3u
          playlist-pt.m3u
          playlist-movies.m3u
          playlist-series.m3u
          playlist-sports.m3u
          playlist-international.m3u
          playlist-all.m3u
          epg.xml.gz
          status.json
          STATUS.md
          data/health.json
          data/channels.json
          data/epg-coverage.json
          data/epg-index.json
          docs/dashboard-data.json
          "
          for f in $PERMITIDOS; do
            # if/then, nao 'test && cmd': com set -e um arquivo ausente abortaria o job.
            if [ -f "$f" ]; then git add -- "$f"; fi
          done

          if git diff --cached --quiet; then
            echo "nada mudou"
            exit 0
          fi

          # Confere que o que foi preparado esta mesmo dentro da lista. Sem pipeline
          # com 'while read': o exit de um subshell nao derrubaria a job.
          echo "$PERMITIDOS" | tr -d ' ' | grep -v '^$' | sort > /tmp/permitidos.txt
          git diff --cached --name-only | sort > /tmp/staged.txt
          FORA=$(comm -23 /tmp/staged.txt /tmp/permitidos.txt)
          if [ -n "$FORA" ]; then
            echo "::error::caminho fora da lista permitida no commit: $(echo "$FORA" | tr '\n' ' ')"
            exit 1
          fi

          echo "arquivos no commit:"
          git diff --cached --name-only | sed 's/^/  /'

          git commit -m "chore(dados): atualiza playlists, EPG e relatorios"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="Authorization: Basic $AUTH" \
              push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"

      - name: Resumo da execucao
        if: always()
        run: |
          if [ -f status.json ]; then
            node -e '
              const s = require("./status.json");
              const l = [];
              l.push("## Resultado");
              l.push("");
              l.push("| Metrica | Valor |");
              l.push("| --- | --- |");
              l.push(`| Canais descobertos | ${s.discovery.channelsDiscovered} |`);
              l.push(`| Streams descobertos | ${s.discovery.streamsDiscovered} |`);
              l.push(`| Canais BR validados | ${s.catalog.brazilianChannels} |`);
              l.push(`| Canais internacionais validados | ${s.catalog.internationalChannels} |`);
              l.push(`| Cobertura de EPG medida | ${s.epg.coveragePercent}% |`);
              l.push(`| Programas no guia | ${s.epg.programmes} |`);
              l.push("");
              l.push("Pontos de observacao medidos (nao somaveis): " +
                Object.keys(s.validation.streamsByVantageAndStatus).join(", "));
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, l.join("\n") + "\n");
            '
          else
            echo "status.json nao foi gerado" >> "$GITHUB_STEP_SUMMARY"
          fi
